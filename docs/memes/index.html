<!--
	Meme bank. Every slide comes from memes.md, so edit that file, not this one.
	  ---   between topics (across, L1); "---" followed by an L2 or L3 comment
	  between entries (down; L3 is the next scene under the same heading)
	Field lines like "**Who:** ..." get a class from their label (field-who,
	field-imdb, field-check ...), styled in src/css/memes.css.

	The Markdown is fetched, so the deck needs a web server: browsers block
	fetching files from file://. In this folder run:  python -m http.server
	then open http://localhost:8000/memes.html (or use VS Code Live Server).
-->

<body>
	<div class="reveal">
		<div class="slides">
			<section data-markdown="memes.md"
				data-separator="^\r?\n---\r?\n$"
				data-separator-vertical="^\r?\n---<!--L[23]-->\r?\n$">
			</section>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
	<script src="https://sdevtutors.github.io/apocalypse-reveal-js/arj/js/deck-start.js"></script>
	<script>
		// Settings only. What each one does is described in the script it belongs to.
		startDeck({
			width: 1280,
			height: 720,
			margin: 0.06,
			center: false,
			hash: true,
			history: true,
			progress: true,
			slideNumber: 'h.v',
			transition: 'none',
			mouseWheel: false, // arj/js/deck.js handles the wheel
			scrollActivationWidth: null, // keep the slides on a phone, not one long page
			plugins: [RevealMarkdown, RevealNotes],

			deckMarkdown: { fitMin: 0.55 }, // arj/js/deck-markdown.js
			linkIcons: { style: 'favicon-before' }, // arj/js/link-icons.js: the site's icon before each link; which icon is src/css/icons.css
			stackBarLinks: true, // arj/js/deck.js: click a grey bar to go to that slide
			tapZones: true, // arj/js/deck.js: on a touch screen, tap left to go back, right to go on
			lock: true, // arj/js/deck.js: the padlock; locked, the mouse changes slides; unlocked, it selects text
			pinTop: true, // arj/js/deck.js: in a tall window the slide sits at the top, not in the middle
			draw: true, // arj/js/deck-start.js and deck-draw.js: the pen, drawing on the slides with tldreveal
			deckControls: { // arj/js/deck-controls.js
				contentsColumns: 4, contentsRows: 3,
				contentsColumnsPortrait: 2, contentsRowsPortrait: 2,
				contentsCaptions: false,
				contentsPageCount: false,
				contentsInFlow: false, // next and back step over the contents; the button still opens them
				numberFormat: 'multilevel', // 5, 5.1, 5.2 ... or 'flat': 1, 2, 3 ...
				numberGroups: true, // the same heading one after another, one level down: 6.1 a film, 6.1.1 its scenes
				numberHeadings: 'bullet', // "(5)" on the slide, left of the centred title
				numberHeadingLevels: ['h1'], // which headings show it: add 'h2', 'h3' for (5.1)
				sidebarSide: 'left',
				home: '../../', // arj/js/deck-controls.js: if the browser won't close the tab, the list of decks
			},

			deckScripts: [ // from the folder deck-start.js is in
				'deck-markdown.js',
				'link-icons.js',
				'deck-controls.js',
				'deck.js',
				'deck-draw.js',
				'deck-search.js',
				'deck-zoom.js',
			],
		});
	</script>
</body>
