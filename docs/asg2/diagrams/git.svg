amily="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#25415f">Integrate prototype</text><circle cx="1000" cy="150" r="10" fill="white" stroke="#25415f" stroke-width="3"/><text x="1000" y="112" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#25415f">Review and document</text><circle cx="420" cy="270" r="10" fill="white" stroke="#2f8f78" stroke-width="3"/><text x="420" y="315" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#2f8f78">Try a small version</text><rect x="45" y="350" width="1070" height="48" rx="8" fill="#eef6fb" stroke="none" stroke-width="2"/><text x="65" y="380" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#10233f">Explain what changed and why; a Git graph illustrates history, not proof of authorship.</text></svg>