<svg xmlns="http://www.w3.org/2000/svg" width="880" height="750" viewBox="0 0 880 750" role="img" aria-label="From observed need to useful training"><title>From observed need to useful training</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#25415f"/></marker></defs><rect width="880" height="750" rx="16" fill="white"/><rect x="24" y="24" width="6" height="52" rx="3" fill="#2f8f78"/><text x="46" y="46" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#10233f">From observed need to useful training</text><text x="46" y="72" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#52667b">A proposed process: investigate, choose the response, then review</text><rect x="245" y="108" width="390" height="82" rx="12" fill="#eef6fb" stroke="#25415f" stroke-width="2"/><circle cx="274" cy="137" r="7" fill="none" stroke="#25415f" stroke-width="3"/><path d="M279 143l7 7" fill="none" stroke="#25415f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="301" y="142" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#25415f">Review observations</text><text x="263" y="169" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#25415f">Records, student experience and supervisor input</text><path d="M440 190V218" fill="none" stroke="#25415f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="245" y="222" width="390" height="82" rx="12" fill="#eef6fb" stroke="#25415f" stroke-width="2"/><circle cx="275" cy="253" r="10" fill="none" stroke="#25415f" stroke-width="3"/><circle cx="275" cy="253" r="4" fill="none" stroke="#25415f" stroke-width="3"/><text x="301" y="256" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#25415f">Confirm the performance gap</text><text x="263" y="283" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#25415f">What is required, and what is getting in the way?</text><path d="M440 304V335" fill="none" stroke="#25415f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="260" y="340" width="360" height="64" rx="12" fill="#fff0e8" stroke="#e4572e" stroke-width="2"/><text x="288" y="379" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#e4572e">?</text><text x="450" y="379" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#7b2c14">Would training help?</text><path d="M340 404V440H220V466" fill="none" stroke="#25415f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="280" y="435" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#2f8f78">Yes</text><path d="M540 404V440H660V466" fill="none" stroke="#25415f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="575" y="435" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#e4572e">Partly or no</text><rect x="40" y="472" width="360" height="88" rx="12" fill="#e2f4ef" stroke="#2f8f78" stroke-width="2"/><path d="M61 503l6 6 14 -15" fill="none" stroke="#2f8f78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="506" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#2f8f78">Design and try training</text><text x="58" y="533" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2f8f78">Clear outcomes, practice and early feedback</text><rect x="480" y="472" width="360" height="88" rx="12" fill="#fff0e8" stroke="#9a4123" stroke-width="2"/><path d="M506 494h15 M498 494h2" fill="none" stroke="#9a4123" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M506 502h15 M498 502h2" fill="none" stroke="#9a4123" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M506 510h15 M498 510h2" fill="none" stroke="#9a4123" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="536" y="506" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#9a4123">Improve conditions</text><text x="498" y="533" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#9a4123">Workload, milestones and access to support</text><path d="M220 560V595H440V619" fill="none" stroke="#25415f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M660 560V595H440" fill="none" stroke="#25415f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="245" y="625" width="390" height="82" rx="12" fill="#25415f" stroke="#ffffff" stroke-width="2"/><path d="M284 652A10 10 0 1 0 284 663 M284 645v7h-7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="301" y="659" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">Review learning and progress</text><text x="263" y="686" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#ffffff">Keep, change or stop what the evidence supports</text><path d="M635 667H862V262H640" fill="none" stroke="#25415f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="848" y="455" text-anchor="end" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#52667b">Revisit</text></svg>